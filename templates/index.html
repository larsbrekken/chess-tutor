<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Tutor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/chessground/assets/chessground.base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/chessground/assets/chessground.brown.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/chessground/assets/chessground.cburnett.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="editor">
    <div class="cg-wrap tray" id="tray-black" data-color="black"></div>
    <div class="board-wrap">
      <div id="board"></div>
    </div>
    <div class="cg-wrap tray" id="tray-white" data-color="white"></div>
  </main>

  <div class="controls">
    <button id="btn-start">Starting position</button>
    <button id="btn-clear">Clear board</button>
  </div>

  <p class="hint">
    Drag pieces from the sides onto the board. Drag a piece off the board to remove it.
  </p>

  <script type="module" src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
