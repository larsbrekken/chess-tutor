{% extends "base.html" %}
{% block content %}
<main class="page-body viewer">
  <aside class="menu" id="puzzle-menu">
    <p class="muted">Loading puzzles…</p>
  </aside>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <section class="panel">
    <h1 id="puzzle-title">Choose a puzzle</h1>
    <p class="big-text" id="puzzle-prompt"></p>

    <div class="feedback" id="feedback" hidden></div>

    <div class="puzzle-actions" id="puzzle-actions" hidden>
      <button id="btn-restart">Start over</button>
      <button id="btn-solution">Show solution</button>
    </div>

    <div class="solution" id="solution" hidden>
      <div class="move-label" id="move-label"></div>
      <p class="big-text" id="solution-text"></p>
      <div class="step-controls">
        <button id="btn-first" title="First (Home)">⏮</button>
        <button id="btn-prev" title="Back (←)">◀</button>
        <button id="btn-next" title="Forward (→)">▶</button>
        <button id="btn-last" title="Last (End)">⏭</button>
        <span class="step-count" id="step-count"></span>
      </div>
      <div class="move-list" id="move-list"></div>
    </div>
  </section>
</main>
<script type="module" src="{{ url_for('static', filename='js/puzzles.js') }}"></script>
{% endblock %}
